name: Refresh portfolio prices

on:
  schedule:
    - cron: "0 0 * * 1-5"
      timezone: "Europe/Copenhagen"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh prices
        run: node scripts/refresh-portfolio.js
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_REFRESH_EMAIL: ${{ secrets.SUPABASE_REFRESH_EMAIL }}
          SUPABASE_REFRESH_PASSWORD: ${{ secrets.SUPABASE_REFRESH_PASSWORD }}
